[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# RPC + verifier credentials — pulled from `.env` (auto-loaded by
# `forge` when present in cwd) so secrets never live in the repo. The
# `${VAR}` syntax requires foundry ≥ v0.2.0 (always-on for current
# stable). If a variable is absent, `forge` falls back to the public
# Base RPC and `--verify` will skip without a key.
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
